<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desire X</title>
    <!--
      The drummer search is over — the band are a full four-piece.

      /drums and /apply were used in Meta ads and shared links, so instead of
      404ing they now send visitors to the EPK. noindex drops the old
      "Drummer Wanted" page out of search results, and the canonical points at
      the homepage so any accumulated link equity follows it there.

      GitHub Pages is a static host with no server-side redirects, so this is a
      meta refresh plus a JS replace, with a plain link as the no-JS fallback.

      The recruitment page itself (src/drums/) was removed in the same commit.
      If the search ever restarts, it is recoverable from git history at 295f381.
    -->
    <meta name="robots" content="noindex,follow" />
    <link rel="canonical" href="https://desirex.co.uk/" />
    <meta http-equiv="refresh" content="0; url=/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #080808;
        color: #a1a1aa;
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 14px;
        letter-spacing: 0.05em;
      }
      a { color: #ef4444; }
    </style>
  </head>
  <body>
    <p>Redirecting to <a href="/">desirex.co.uk</a>…</p>
    <script>
      window.location.replace('/')
    </script>
  </body>
</html>
