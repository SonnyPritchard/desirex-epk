<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desire X — Electronic Press Kit</title>
    <meta name="description" content="Official Electronic Press Kit for Desire X — alt rock from Bristol, UK. Booking, press, and music." />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://desirex.co.uk/" />

    <!--
      Link preview card. Scrapers (WhatsApp, Slack, LinkedIn, Outlook, iMessage)
      need absolute URLs here — a relative path renders as a blank card, which is
      what a booking agent would see when the EPK link is pasted into an email.
      og-image.jpg is 1200x630, the size every platform crops to.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Desire X" />
    <meta property="og:url" content="https://desirex.co.uk/" />
    <meta property="og:title" content="Desire X — Electronic Press Kit" />
    <meta property="og:description" content="Alt rock from Bristol, UK. Music, live video, press photos and booking contact." />
    <meta property="og:image" content="https://desirex.co.uk/assets/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Desire X — alt rock band from Bristol, UK" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Desire X — Electronic Press Kit" />
    <meta name="twitter:description" content="Alt rock from Bristol, UK. Music, live video, press photos and booking contact." />
    <meta name="twitter:image" content="https://desirex.co.uk/assets/og-image.jpg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
